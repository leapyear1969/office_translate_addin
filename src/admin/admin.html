<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>翻译插件 · 使用统计</title><link rel="stylesheet" href="/admin.css"></head>
<body>
  <header><div class="brand"><span class="mark" aria-hidden="true">译</span><div><strong>翻译插件</strong><small>使用统计后台</small></div></div><div class="account"><span id="account"></span><button id="login" type="button">管理员登录</button><button id="logout" type="button" hidden>退出</button></div></header>
  <main>
    <nav aria-label="统计页面"><a id="usage-link" href="/admin/usage">用户使用</a><a id="api-link" href="/admin/api">API 用量</a></nav>
    <div class="heading"><div><p class="eyebrow">WORD & OUTLOOK</p><h1 id="page-title">用户使用</h1><p id="page-description">查看谁在使用，以及来自哪个平台与客户端。</p></div><span class="badge">北京时间 · 按日汇总</span></div>
    <p id="status" role="status" aria-live="polite">正在读取登录配置…</p>
    <section id="workspace" hidden>
      <form id="filters" class="filters">
        <label>开始日期<input id="from" type="date" required></label><label>截止日期<input id="to" type="date" required></label>
        <label>租户<select id="tenant"><option value="">全部授权租户</option></select></label>
        <label>平台<select id="host"><option value="">全部平台</option><option value="word">Word</option><option value="outlook">Outlook</option><option value="unknown">未识别</option></select></label>
        <label>客户端<select id="client-type"><option value="">全部客户端</option><option value="online">online · 网页</option><option value="local">local · 桌面</option><option value="unknown">未识别</option></select></label>
        <label class="search">用户<input id="search" type="search" maxlength="100" placeholder="搜索姓名或邮箱"></label><button id="refresh" type="submit">查询</button>
      </form>
      <p id="coverage" class="notice"></p>
      <div id="report" hidden>
        <section id="cards" class="cards" aria-label="指标概览"></section>
        <section class="panel"><div class="panel-title"><h2>每日趋势</h2><span id="trend-note"></span></div><div id="trend" class="trend"></div></section>
        <section id="interfaces-panel" class="panel" hidden><h2>接口用量</h2><div id="interfaces" class="table-wrap"></div></section>
        <section class="panel"><h2>平台与客户端分布</h2><p class="muted" id="platform-note"></p><div id="platforms" class="table-wrap"></div></section>
        <section class="panel"><div class="panel-title"><h2>用户列表</h2><span id="user-count"></span></div><div id="users" class="table-wrap"></div><div class="pagination"><button id="previous" type="button">上一页</button><span id="page"></span><button id="next" type="button">下一页</button></div></section>
      </div>
    </section>
    <footer>仅统计已验证并进入处理的请求。翻译请求包含自动预览刷新，不代表点击次数或成功交付次数。<br>local 表示桌面客户端，翻译仍调用云端服务。</footer>
  </main>
</body></html>
