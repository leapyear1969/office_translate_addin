<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>翻译选项</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="/taskpane.css">
</head>
<body>
  <main>
    <header class="pane-header">
      <h1><img class="heading-icon" src="/assets/icon-32.png" width="24" height="24" alt="">翻译选项</h1>
      <div class="account-control">
        <button id="account-avatar" class="account-avatar" type="button" aria-label="用户账户" aria-haspopup="dialog" aria-expanded="false" aria-controls="account-menu">
          <img id="account-photo" alt="" hidden><span id="account-initial" aria-hidden="true">人</span>
        </button>
        <section id="account-menu" class="account" role="dialog" aria-label="用户账户" hidden>
          <div class="account-details">
            <p id="account-name">请在 Word 中打开此面板</p>
            <p id="account-email" class="muted"></p>
          </div>
          <div class="account-actions">
            <button id="signin" type="button" hidden>重新登录</button>
            <button id="signout" type="button" disabled>注销</button>
          </div>
        </section>
      </div>
    </header>
    <p id="browser-consent" hidden>如果浏览器没有打开，请<a id="browser-consent-link" target="_blank" rel="noopener noreferrer">点击此处继续授权</a>，或复制链接到默认浏览器。授权完成后请关闭浏览器窗口，并重新打开插件。</p>
    <section class="message-actions" aria-label="当前文档操作">
      <button id="translate-selection" type="button" class="primary" disabled>翻译选中文字</button>
      <button id="translate-paragraph" type="button" disabled>翻译当前段落</button>
      <button id="translate-body" type="button" disabled>翻译正文全文</button>
      <button id="restore-original" type="button" disabled>恢复原文</button>
    </section>
    <p class="hint">首次翻译前保存整份正文备份，后续翻译不会覆盖。备份随文档保存并随文件共享；恢复会还原整份正文，包括撤回备份之后的正文编辑。页眉、页脚等独立内容不在备份范围内。</p>
    <section id="restore-prompt" hidden aria-label="确认恢复原文">
      <p>恢复首次翻译前的整份正文？这会替换当前全部正文，包括之后的翻译和编辑。</p>
      <button id="confirm-restore" type="button">确认恢复整份正文</button>
      <button id="cancel-restore" type="button">取消</button>
    </section>
    <form id="preferences">
      <fieldset id="settings-fields" disabled>
        <p class="hint">文档默认不翻译，选中需要的内容后点击翻译按钮，或主动选择翻译当前段落、正文全文。当前段落指光标所在段落或选区的第一个段落。译文替换原文，可使用 Word 撤销或恢复原文备份。目标语言设置随当前文档保存。</p>
        <div class="target-row"><label for="target-language">将文档翻译为：</label><select id="target-language" name="target"></select></div>
        <div class="footer"><button class="primary" type="submit" id="save">保存设置</button><span id="save-status" role="status" aria-live="polite"></span></div>
      </fieldset>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
